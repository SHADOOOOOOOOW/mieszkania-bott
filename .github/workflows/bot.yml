name: mieszkania-bot

# BOT ZATRZYMANY - automatyczny harmonogram jest wylaczony.
# Zostalo tylko reczne uruchomienie (Actions -> mieszkania-bot -> Run workflow).
#
# Zeby wlaczyc bota z powrotem, odkomentuj ponizsze dwie linie "schedule":
# on:
#   schedule:
#     - cron: "*/15 * * * *"
#
# Jak to dzialalo: GitHub cron nie umie "co minute" (min. 5 min i bywa opozniony),
# wiec jeden przebieg zyl ~50 minut i sam odpytywal co 60 s, a cron co 15 min
# pilnowal, zeby po zakonczeniu przebiegu wystartowal nastepny (concurrency
# trzyma dokladnie jeden aktywny + jeden w kolejce).
on:
  workflow_dispatch: {}   # pozwala uruchomic recznie z zakladki Actions

permissions:
  contents: read

concurrency:
  group: mieszkania-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pamiec o juz wyslanych ogloszeniach (przenoszona miedzy uruchomieniami).
      - name: Przywroc seen.json
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Sprawdz oferty i wyslij na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ secrets.ROLE_ID }}
          MAX_MINUTES: "50"   # konczy sie sam przed timeoutem, by zapisac cache
        run: python bot.py
