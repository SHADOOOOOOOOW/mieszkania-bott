name: mieszkania-bot

# Sprawdza oferty co MINUTE - komputer moze byc wylaczony.
# GitHub cron nie umie "co minute" (min. 5 min i bywa opozniony), wiec jeden
# przebieg zyje ~50 minut i sam odpytuje co 60 s. Cron co 15 min tylko pilnuje,
# zeby po zakonczeniu przebiegu od razu wystartowal nastepny (concurrency
# trzyma dokladnie jeden aktywny + jeden w kolejce).
#
# Webhook Discorda NIE jest w repo - siedzi w sekrecie DISCORD_WEBHOOK
# (Settings -> Secrets and variables -> Actions). Zeby przelaczyc bota na inny
# kanal, podmien sam sekret - w kodzie nic sie nie zmienia.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # pozwala uruchomic recznie z zakladki Actions

permissions:
  contents: read

concurrency:
  group: mieszkania-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pamiec o juz wyslanych ogloszeniach (przenoszona miedzy uruchomieniami).
      - name: Przywroc seen.json
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: |
            seen-

      - name: Sprawdz oferty i wyslij na Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE_ID: ${{ secrets.ROLE_ID }}
          MAX_MINUTES: "50"   # konczy sie sam przed timeoutem, by zapisac cache
        run: python bot.py
